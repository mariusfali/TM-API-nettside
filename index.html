            let selected_month = months.selectedOptions[0].value

        function createDates(){
            const dbref = ref(db);
            let month = correctly_selected_month()
            get(child(dbref, "crashmania-totd/" + month)).then((snapshot) => {
                if (snapshot.exists()){
                    //console.log(snapshot.val())
                    let data = snapshot.val();
                    //console.log(data.length)
                    //console.log(dates)
                    dates.innerHTML = ""
                    for (let i = 1; i < data.length; i++){
                        let new_element = document.createElement("option")
                        new_element.innerText = i
                        new_element.classList.add("date-option")
                        dates.appendChild(new_element)
                        console.log(new_element)
                    }
                }
                else{
                    console.log("Data does not exist")
                }
            })
            .catch((error)=>{
                console.log(error);
            })
        }

                    //console.log(typeof(data)) // Datatypen er en string
